<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Sign up</title>
        <style>
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #f5f6f8;
                font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                color: #2c3e50;
            }
            .card {
                background: #ffffff;
                padding: 40px 36px;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.06);
                width: 320px;
            }
            .title {
                text-align: center;
                font-size: 20px;
                font-weight: 600;
                margin: 0 0 28px 0;
            }
            input[type="text"], input[type="password"] {
                width: 100%;
                padding: 11px 14px;
                margin-bottom: 16px;
                border: 1px solid #dcdfe6;
                border-radius: 8px;
                font-size: 14px;
                outline: none;
                transition: border-color .2s;
            }
            input[type="text"]:focus, input[type="password"]:focus {
                border-color: #4a90d9;
            }
            button {
                width: 100%;
                padding: 11px;
                border: none;
                border-radius: 8px;
                background: #4a90d9;
                color: #fff;
                font-size: 15px;
                cursor: pointer;
                transition: background .2s;
            }
            button:hover { background: #3a7bc0; }
            .mhw-link {
                margin-top: 22px;
                text-align: center;
            }
            .mhw-link a {
                color: #6b7785;
                font-size: 13px;
                text-decoration: none;
            }
            .mhw-link a:hover { color: #4a90d9; }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="title">注册 / 登陆</div>
            <div class="login">
                <form action="login" method="post">
                    <input type="text" name="username" placeholder="用户名" required="required">
                    <input type="password" name="password" placeholder="用户密码" required="required">
                    <button type="submit">注册/登陆</button>
                </form>
            </div>
            <div class="mhw-link"><a href="/mhw">不想注册？看个猫图先</a></div>
        </div>
    </body>
</html>
